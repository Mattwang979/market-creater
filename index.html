<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d1c">
<title>熱度交易所</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#0b0e1f; --panel:#131932; --panel-2:#1b2346; --line:#2a335c;
  --ink:#eef1fb; --muted:#a2abcb;
  --hot:#ff4f5e; --amber:#ffb547; --cyan:#5cc8ff; --violet:#a184ff; --gold:#ffd27a;
  --up:#ff7380; --down:#3ddc97;
  --f-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  --f-num:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#080b19; --panel:#11162e; --panel-2:#192142; --line:#283158; }
}
:root[data-theme="dark"]{ --bg:#080b19; --panel:#11162e; --panel-2:#192142; --line:#283158; }
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg);}
*,*::before,*::after{box-sizing:border-box;}
body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation;}
button:disabled{opacity:.4;cursor:not-allowed;}
button:focus-visible,input:focus-visible,canvas:focus-visible{outline:3px solid var(--cyan);outline-offset:2px;}
input{-webkit-user-select:text;user-select:text;}
.num{font-family:var(--f-num);font-weight:700;font-style:italic;font-variant-numeric:tabular-nums;}
.up{color:var(--up);} .down{color:var(--down);} .muted{color:var(--muted);}
svg{display:block;}

#app{height:100%;max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:6px;padding:6px 10px 0;}

/* HUD */
#hud{flex:none;display:flex;flex-direction:column;gap:6px;}
.r1{display:flex;align-items:center;gap:8px;height:42px;}
.lvbtn{position:relative;width:42px;height:42px;border-radius:50%;border:0;padding:0;background:transparent;flex:none;display:grid;place-items:center;}
.lvbtn .ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--amber) var(--p,0%),var(--line) 0);-webkit-mask:radial-gradient(circle,transparent 16px,#000 17px);mask:radial-gradient(circle,transparent 16px,#000 17px);}
.lvbtn b{position:relative;font-family:var(--f-num);font-style:italic;font-weight:700;font-size:19px;line-height:1;}
.lvbtn small{position:absolute;bottom:-3px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:900;background:var(--amber);color:#1a1205;border-radius:6px;padding:0 4px;line-height:13px;}
.co{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25;}
.co .nm{font-size:15px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.co span{font-size:11px;color:var(--muted);}
.co span b{font-size:15px;color:var(--ink);}
.eq{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1;}
.eq span{font-size:10px;color:var(--muted);}
.eq b{font-size:21px;}
.eq i{font-style:normal;font-size:12px;font-weight:700;}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);display:grid;place-items:center;padding:0;position:relative;flex:none;}
.ib .bd{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:9px;background:var(--hot);color:#fff;font-size:10px;font-weight:700;line-height:17px;text-align:center;padding:0 4px;}
.r2{display:flex;align-items:center;justify-content:space-between;gap:8px;height:34px;}
.clock{display:flex;align-items:center;gap:7px;min-width:0;}
.clock b{font-size:25px;line-height:1;}
.clock .dd{font-size:12px;color:var(--muted);white-space:nowrap;}
.wx{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--panel-2);white-space:nowrap;}
.speed{display:flex;gap:3px;padding:3px;border-radius:12px;background:var(--panel);border:1px solid var(--line);flex:none;}
.speed button{min-width:36px;height:30px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-family:var(--f-num);font-weight:700;font-size:16px;padding:0;display:grid;place-items:center;}
.speed button[aria-pressed="true"]{background:var(--amber);color:#1a1205;}
.dtabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;}
.dt{height:42px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:4px 3px 6px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;position:relative;font-size:12px;font-weight:700;}
.dt[aria-pressed="true"]{background:var(--dc);border-color:var(--dc);color:#fff;}
.dt .tb{width:78%;height:4px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden;}
.dt .tb i{display:block;height:100%;width:0;background:var(--amber);border-radius:2px;transition:width .5s ease;}
.dt[aria-pressed="true"] .tb i{background:#fff;}
.dt .ev{position:absolute;top:-4px;right:-3px;width:11px;height:11px;border-radius:50%;background:var(--hot);box-shadow:0 0 0 2px var(--bg);animation:blink 1s ease-in-out infinite;}
@keyframes blink{50%{opacity:.3}}

/* scene */
#sceneWrap{flex:1 1 auto;min-height:150px;position:relative;border-radius:18px;overflow:hidden;background:#141a3a;}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;}
.s-tl{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;pointer-events:none;max-width:48%;}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;background:rgba(6,8,22,.74);font-size:12px;font-weight:700;white-space:nowrap;}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--hot);animation:blink 1s ease-in-out infinite;}
.chip b{font-family:var(--f-num);font-style:italic;font-size:15px;}
.qa{position:absolute;right:8px;top:8px;display:flex;gap:5px;}
.qb{width:46px;height:50px;border-radius:13px;border:1px solid rgba(255,255,255,.16);background:rgba(6,8,22,.76);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:700;padding:0;position:relative;overflow:hidden;}
.qb .fill{position:absolute;left:0;right:0;bottom:0;background:rgba(255,181,71,.28);height:0;}
.qb > *:not(.fill){position:relative;}
.qb.on{border-color:var(--amber);box-shadow:0 0 0 2px rgba(255,181,71,.35);}
.qb.cd{opacity:.55;}
.qb.warn{border-color:var(--hot);color:#ffd0d4;}
.banner{position:absolute;left:50%;top:66px;transform:translate(-50%,-10px);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;max-width:92%;display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:14px;background:rgba(6,8,22,.86);border:1px solid var(--line);}
.banner.show{opacity:1;transform:translate(-50%,0);}
.banner .k{flex:none;font-size:11px;font-weight:900;padding:1px 7px;border-radius:6px;background:var(--hot);color:#fff;}
.banner p{margin:0;font-size:13px;font-weight:700;line-height:1.35;}
.bigcard{position:absolute;left:8px;right:8px;bottom:8px;border-radius:14px;background:var(--amber);color:#1a1205;padding:8px 10px 10px;display:flex;align-items:center;gap:8px;animation:slidein .25s ease-out;}
.bigcard[hidden]{display:none;}
@keyframes slidein{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
.bigcard p{flex:1;margin:0;font-size:12px;line-height:1.35;min-width:0;}
.bigcard p b{font-size:14px;}
.bigcard button{border:0;border-radius:10px;height:40px;padding:0 12px;font-weight:900;font-size:13px;}
.bigcard .ok{background:#1a1205;color:var(--amber);}
.bigcard .no{background:rgba(0,0,0,.14);color:#1a1205;}
.bigcard .bar{position:absolute;left:10px;right:10px;bottom:4px;height:3px;border-radius:2px;background:rgba(0,0,0,.18);overflow:hidden;}
.bigcard .bar i{display:block;height:100%;background:#1a1205;width:100%;}

/* chart */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;}
#chartPanel{flex:none;padding:7px 8px 6px;}
.ch-h{display:flex;justify-content:space-between;align-items:center;gap:6px;}
.ctabs{display:flex;gap:2px;padding:2px;border-radius:10px;background:var(--panel-2);}
.ctabs button{height:28px;padding:0 8px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:12px;font-weight:700;}
.ctabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);}
.cval{font-size:11px;color:var(--muted);text-align:right;white-space:nowrap;line-height:1.1;}
.cval b{font-size:20px;color:var(--ink);}
.drv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin:6px 0 5px;}
.dv{display:flex;justify-content:space-between;align-items:baseline;gap:2px;padding:2px 6px;border-radius:7px;background:var(--panel-2);font-size:11px;color:var(--muted);white-space:nowrap;}
.dv b{font-family:var(--f-num);font-style:italic;font-size:14px;}
#chart{display:block;width:100%;height:80px;}
.lq{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:11px;color:var(--muted);}
.lq-l{flex:none;}
.lq-bar{flex:1;position:relative;height:8px;border-radius:4px;background:var(--panel-2);}
.lq-bar #lqFill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:linear-gradient(90deg,#1f8f87,#2ed6c4);transition:width .5s;}
.lq-bar .tg{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:#fff;opacity:.7;border-radius:1px;}
.lq-bar b{position:absolute;top:0;bottom:0;width:1px;background:rgba(0,0,0,.5);}
.lq-v{flex:none;min-width:58px;white-space:nowrap;}
.lq-v b{font-size:16px;color:#7ff0e2;margin-right:3px;}
.lq-al{flex:none;height:30px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font-size:12px;font-weight:700;}
.hotc{color:var(--up);font-weight:700;}
.up2{color:#7ff0e2;} .down2{color:var(--up);}
.grp{font-size:15px;font-weight:900;margin:16px 0 6px;}
.rules{padding-left:1.1em;margin:8px 0;line-height:1.7;}
.ledger{display:grid;grid-template-columns:1fr auto;gap:5px 10px;margin-top:8px;font-size:13px;}
.ledger b{font-size:16px;text-align:right;}
.src.cat{background:#ff9ecb;color:#2a0a18;}

/* dock */
#dock{flex:none;padding:8px 10px;}
.dk-r1{display:flex;align-items:center;gap:9px;}
.dk-ic{width:36px;height:36px;border-radius:11px;background:var(--panel-2);display:grid;place-items:center;flex:none;}
.dk-nm{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3;}
.dk-nm b{font-size:14px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.stc{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.stc.peak{color:var(--gold);} .stc.off{color:var(--cyan);} .stc.closed{color:var(--muted);} .stc.tgt{color:var(--violet);} .stc.pulled,.stc.panic{color:var(--up);}
.dk-inv{text-align:right;font-size:11px;color:var(--muted);line-height:1.35;flex:none;}
.dk-inv > span{display:block;}
.dk-inv b{font-size:16px;color:var(--ink);}
.hearts{display:flex;gap:1px;justify-content:flex-end;}
.dk-r2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin-top:6px;position:relative;}
.qs{display:flex;align-items:center;gap:3px;min-width:0;}
.qs button{width:30px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font-size:19px;padding:0;flex:none;}
.qv{flex:1;min-width:0;height:44px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;color:#0b1020;}
.qs.bid .qv{background:var(--cyan);} .qs.ask .qv{background:var(--amber);}
.qs.tgt .qv{background:var(--panel-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);}
.qs.tgt.hit .qv{background:var(--violet);color:#120a2e;box-shadow:none;}
.qv small{font-size:10px;font-weight:900;opacity:.75;}
.qv b{font-size:21px;}
.dk-al{height:44px;padding:0 11px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font-weight:700;font-size:13px;}
.dk-lock{position:absolute;top:0;bottom:0;left:0;right:calc(33.33% + 2px);border-radius:10px;background:rgba(9,12,28,.82);display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:700;color:var(--gold);text-align:center;padding:0 8px;}
.dk-empty{display:flex;align-items:center;gap:10px;}
.dk-empty p{flex:1;margin:0;font-size:13px;color:var(--muted);}

/* bottom nav */
#bnav{flex:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding:0 0 4px;}
#bnav button{height:50px;border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;position:relative;border-radius:12px;}
#bnav button:active{background:var(--panel);}
#bnav .bd{position:absolute;top:3px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--hot);color:#fff;font-size:10px;line-height:16px;padding:0 4px;}

/* sheets */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(3,5,14,.62);display:flex;align-items:flex-end;justify-content:center;}
.sheet{width:100%;max-width:540px;max-height:88%;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);animation:rise .22s ease-out;}
@keyframes rise{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 10px;flex:none;}
.sh-head h2{margin:0;font-size:19px;font-weight:900;}
.sh-x{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);padding:0;display:grid;place-items:center;flex:none;}
.sh-body{overflow:auto;padding:0 16px 18px;overscroll-behavior:contain;-webkit-user-select:none;user-select:none;}
.sh-body p{margin:6px 0;}
.small{font-size:12px;}
.card{border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0;background:var(--bg);}
.card h3{margin:0;font-size:16px;font-weight:900;}
.row{display:flex;align-items:center;gap:10px;}
.sp{flex:1;min-width:0;}
.btn{border:0;border-radius:12px;min-height:44px;padding:0 14px;font-weight:900;font-size:14px;background:var(--ink);color:var(--bg);}
.btn.hot{background:var(--hot);color:#fff;}
.btn.amber{background:var(--amber);color:#1a1205;}
.btn.ghost{background:var(--panel-2);color:var(--ink);}
.btn.wide{display:block;width:100%;margin-top:12px;}
.btn.armed{background:var(--hot);color:#fff;}
.btn:active{transform:scale(.98);}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--panel-2);white-space:nowrap;}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
.scard{border:1px solid var(--line);border-radius:14px;padding:10px;background:var(--bg);display:flex;flex-direction:column;gap:6px;min-width:0;}
.scard .ti{display:flex;align-items:center;gap:7px;font-weight:900;font-size:14px;}
.scard .ti span{width:30px;height:30px;border-radius:9px;background:var(--panel-2);display:grid;place-items:center;flex:none;color:var(--amber);}
.scard p{margin:0;font-size:12px;color:var(--muted);line-height:1.45;flex:1;}
.scard .meta{font-size:11px;color:var(--muted);}
.scard .btn{min-height:40px;font-size:13px;}
.seg-chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px;}
.seg-chips button{height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;}
.seg-chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);}
.bars{display:grid;grid-template-columns:2.4em 1fr 2.8em;gap:7px 8px;align-items:center;font-size:13px;}
.bar{height:10px;border-radius:5px;background:var(--panel-2);position:relative;}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--ink);}
.bar .tg{position:absolute;top:-4px;bottom:-4px;width:4px;margin-left:-2px;border-radius:2px;}
.val{text-align:right;font-family:var(--f-num);font-style:italic;font-weight:700;font-size:16px;}
.prog{height:8px;border-radius:4px;background:var(--panel-2);overflow:hidden;margin-top:6px;}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--hot));border-radius:4px;}
.list-item{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line);}
.list-item p{margin:0;}
.when{grid-column:2;font-size:11px;color:var(--muted);}
.src{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--panel-2);white-space:nowrap;align-self:start;}
.src.rumor{background:var(--amber);color:#1a1205;} .src.clarify{background:var(--down);color:#062016;} .src.confirm,.src.panic{background:var(--hot);color:#fff;} .src.event{background:var(--violet);color:#fff;} .src.wx{background:var(--cyan);color:#06202e;}
.field{display:block;font-size:13px;font-weight:700;margin:14px 0 6px;}
.text-in{width:100%;font-family:var(--f-ui);font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);}
.ptrow{display:grid;grid-template-columns:2.6em 40px 1fr 40px;gap:8px;align-items:center;margin:6px 0;}
.rb{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font-size:18px;padding:0;}
.pips{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;}
.pips i{height:14px;border-radius:4px;background:var(--panel-2);}
.pips i.on{background:var(--amber);}
.opts{display:flex;flex-wrap:wrap;gap:6px;}
.opts button{min-height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;}
.opts button[aria-pressed="true"]{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber);}
.swatch{width:40px;height:40px;border-radius:50%;border:2px solid transparent;padding:0;}
.swatch[aria-pressed="true"]{border-color:#fff;}
.setrow{display:flex;justify-content:space-between;align-items:center;margin:14px 0;font-weight:700;}
.toggle{width:52px;height:30px;border-radius:15px;border:0;background:var(--panel-2);position:relative;padding:0;flex:none;}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;}
.toggle[aria-pressed="true"]{background:var(--down);}
.toggle[aria-pressed="true"]::after{left:25px;}
.shout{display:inline-block;font-size:28px;font-weight:900;color:#fff;background:var(--hot);padding:2px 14px;transform:skewX(-10deg);box-shadow:5px 5px 0 var(--amber);margin:4px 0 12px;}
.cd{height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden;margin-top:12px;}
.cd i{display:block;height:100%;width:100%;background:var(--hot);}
.lvup{font-family:var(--f-num);font-style:italic;font-weight:700;font-size:54px;line-height:1;color:var(--amber);text-align:center;margin:8px 0;}
#mapCv{display:block;width:100%;border-radius:16px;touch-action:manipulation;cursor:pointer;}

function setQuote(st, side, val){
  if(!st) return;
  if(side === 'tgt'){ st.tgt = clamp(Math.round(val), 0, st.cap); return; }
  if(locked(st)){ toast('尖峰中報價鎖定'); return; }
  if(st.pulled){ toast('已撤單，先恢復報價'); return; }
  val = Math.round(val); val = Math.max(side === 'ask' ? 2 : 1, Math.min(9999, val));
  st[side] = val;
  if(side === 'bid' && st.bid >= st.ask) st.ask = st.bid + 1;
  if(side === 'ask' && st.ask <= st.bid) st.bid = Math.max(1, st.ask - 1);
  if(side === 'bid'){
    if(st.inv >= tgtOf(st)) toast('庫存已達進貨目標，供應商會被婉拒；要多收貨請調高進貨目標');
    else if(inHours(st, hourOf(S.t))) toast('營業中只有客人上門，供應商打烊後才會來');
  }
  if(st.mods.pledgeDay === dayOf(S.t) && !st.mods.pledgeBroken && (st.ask - st.bid)/st.V > 0.065) toast('注意：價差超過 6% 會違反造市承諾');
}

      case 'repay': var amt = Math.min(500, S.debt, S.cash); if(amt > 0){ S.debt -= amt; S.cash -= amt; if(S.debt < 0.5) S.debt = 0; renderSheet(); } return;
      case 'seg': ui.seg = Number(b.dataset.v); renderSheet(); return;
      case 'doRes': var rq = RESEARCH[Number(b.dataset.v)], si = ui.seg; if(S.cash < rq.cost) return; S.cash -= rq.cost; var T = targets(); S.reports[si] = {t:S.t, type:rq.n, cur:S.prefs[si].map(function(v){ return clamp(v + gauss()*rq.sd, 0, 1.3); }), tgt:rq.tgt ? T[si].map(function(v){ return clamp(v + gauss()*0.04, 0, 1.3); }) : null}; sfx('click'); renderSheet(); return;
      case 'stay': case 'flee': var ps = stallById(ui.panicSid); if(ps){ decidePanic(ps, a === 'stay'); sfx(a === 'stay' ? 'coin' : 'bad'); } ui.panicSid = null; ui.hard = false; dismissSheet(); return;
    }
  });
  document.addEventListener('input', function(ev){
    var t = ev.target;
    if(t.id === 'coName2'){ var v = t.value.trim(); SETTINGS.name = v ? v.slice(0,12) : '熱血商行'; saveSettings(); }
    if(t.id === 'rndName' && ui.draft){ ui.draft.name = t.value; var g = $('rndGo'); if(g) g.disabled = !(ui.draft.name.trim() && ui.draft.pts.some(function(x){ return x > 0; }) && S.cash >= CFG.rndFee); }
  });
  $('scene').addEventListener('click', function(ev){
    var r = $('scene').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top, g = geom();
    var st = stallIn(S.sel);
    if(!st && !DIST[S.sel].port){ if(S.stalls.length < maxStalls()) startFlow(S.sel); else toast('升級後才能開更多攤位'); return; }
    if(st && Math.abs(x - g.stallX) < g.stallW/2 && y > g.hor){ ui.stratSid = st.id; openSheet('strat'); }
  });
  document.addEventListener('click', function(ev){
    var cv = $('mapCv'); if(!cv || ev.target !== cv || !SC.mapPaths) return;
    var r = cv.getBoundingClientRect(), k = r.width/358, x = (ev.clientX - r.left)/k, y = (ev.clientY - r.top)/k, c = cv.getContext('2d');
    c.setTransform(1,0,0,1,0,0);
    for(var id in SC.mapPaths){ if(c.isPointInPath(SC.mapPaths[id], x, y)){ selectDist(id); closeSheet(); updateDOM(); return; } }
  });
  var ro = function(){ resizeScene(); resizeChart(); };
  window.addEventListener('resize', function(){ clearTimeout(ui.rt); ui.rt = setTimeout(ro, 120); });
  // 版面高度會隨面板內容改變（不只視窗縮放），畫布要跟著重設尺寸，否則會被拉伸變形
  if(window.ResizeObserver){
    var obs = new ResizeObserver(function(){ ro(); drawScene(performance.now()); drawChart(); });
    obs.observe($('sceneWrap')); obs.observe($('chart'));
  }
  document.addEventListener('visibilitychange', function(){ if(document.hidden) saveGame(); });
  window.addEventListener('pagehide', saveGame);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ SC.key = ''; });
}
function newGameNow(){
  try { localStorage.removeItem('heatx6-save'); } catch(e) {}
  newState(); queue = []; ui.hard = false; ui.panicSid = null; ui.restartArm = false; dismissSheet(); hideBig();
  SC.agents = []; SC.back = []; SC.key = ''; ui.dockKey = ''; updateDOM(); startFlow(null);
}
function loop(ts){
  var dt = Math.min(100, ts - (ui.last || ts)); ui.last = ts;
  var run = !ui.paused && !ui.hard && !ui.auto && !S.over && !S.setup;
  if(run){ ui.acc += dt*ui.speed/CFG.hourMs*60; var k = 0; while(ui.acc >= 1 && k < 300){ stepMinute(); ui.acc -= 1; k++; } if(ui.acc > 5) ui.acc = 0; }
  if(S.big && run){ S.big.left -= dt; var bb = $('bigBar'); if(bb) bb.style.width = clamp(S.big.left/14000*100, 0, 100) + '%'; if(S.big.left <= 0){ S.big = null; hideBig(); toast('大單被別人接走了'); } }
  if(ui.panicSid){ var left = ui.panicEnd - ts, pb = $('panicBar'); if(pb) pb.style.width = clamp(left/9000*100, 0, 100) + '%'; if(left <= 0){ var ps = stallById(ui.panicSid); if(ps) decidePanic(ps, false); toast('猶豫太久，自動撤單了'); sfx('bad'); ui.panicSid = null; ui.hard = false; dismissSheet(); } }
  updateScene(dt/1000);
  drawScene(ts);
  drawChart();
  if(ui.sheet && ui.sheet.type === 'map' && ts - (ui.mapT || 0) > 120){ ui.mapT = ts; drawMap(); }
  if(ts - ui.domT > 220){ ui.domT = ts; updateDOM(); }
  if(ts - ui.saveT > 20000){ ui.saveT = ts; saveGame(); }
  requestAnimationFrame(loop);
}
function boot(){
  if(!loadGame()) newState();
  buildStatic(); bind(); resizeScene(); resizeChart(); updateDOM();
  if(S.setup){ if(SETTINGS.seenHelp) startFlow(null); else openSheet('help'); }
  else openSheet('help');
  requestAnimationFrame(loop);
}
if(UI) boot();

</script>
